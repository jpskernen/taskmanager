<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Task Manager</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-4">
      <!-- Header -->
      <header class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h1><i class="bi bi-check2-square me-2"></i>Interactive Task Manager</h1>
            <p>Manage your tasks efficiently with localStorage persistence</p>
          </div>
          <span id="taskCount">0 tasks</span>
        </div>
      </header>

      <!-- Add Task Card -->
      <div class="card mb-4">
        <div class="card-header">
          <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Add New Task</h5>
        </div>
        <div class="card-body p-3">
          <form id="addTaskForm">
            <div class="input-group">
              <input
                type="text"
                id="taskInput"
                class="form-control"
                placeholder="Enter task title..."
                autocomplete="off"
              />
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Add Task
              </button>
            </div>
            <div id="addTaskError" class="text-danger mt-2" style="display: none;"></div>
          </form>
        </div>
      </div>

      <!-- Storage Actions Card -->
      <div class="card mb-4">
        <div class="card-header">
          <h5 class="mb-0"><i class="bi bi-hdd me-2"></i>Storage Actions</h5>
        </div>
        <div class="card-body p-3">
          <div class="d-flex gap-2 flex-wrap">
            <button id="saveBtn" class="btn btn-info">
              <i class="bi bi-save me-1"></i>Save to Storage
            </button>
            <button id="loadBtn" class="btn btn-warning">
              <i class="bi bi-cloud-download me-1"></i>Load from Storage
            </button>
            <button id="clearBtn" class="btn btn-danger">
              <i class="bi bi-trash me-1"></i>Clear All
            </button>
          </div>
        </div>
      </div>

      <!-- Tasks List Card -->
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0"><i class="bi bi-list-task me-2"></i>Tasks</h5>
        </div>
        <div class="card-body p-3">
          <div id="tasksList"></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
